name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-30 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build desktop, server and Android packages
        run: ./gradlew --max-workers=2 releaseJSettlers releaseDedicatedServer releaseAndroid

      - name: Verify release packages
        shell: bash
        run: |
          test -s release/JSettlers.zip
          test -s release/DedicatedJSettlersServer.jar
          test -s release/JSettlers-Android.zip
          test -s jsettlers.main.android/build/outputs/apk/debug/jsettlers.main.android-debug.apk
          unzip -t release/JSettlers.zip
          unzip -t release/JSettlers-Android.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            release/JSettlers.zip
            release/DedicatedJSettlersServer.jar
            release/JSettlers-Android.zip
            jsettlers.main.android/build/outputs/apk/debug/jsettlers.main.android-debug.apk
