name: CI

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v4
    - run: ./gradlew -PskipAndroid --max-workers=2 release
    - uses: actions/upload-artifact@v4
      with:
        name: Release
        path: 'release/*'

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v4
    - run: ./gradlew -PskipAndroid --max-workers=2 test -x :jsettlers.logic:test :jsettlers.logic:unitTest
    - name: Save/load round trip
      run: ./gradlew -PskipAndroid --max-workers=2 :jsettlers.logic:replayValidationIT --tests jsettlers.integration.replay.ReplayValidationIT.testIfSavegameOfSavegameEqualsSavegame
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Test-reports
        path: "**/build/reports/tests/"
